<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#01121a" />
  <title>Deep School</title>
  <style>
    :root {
      --ink: rgba(220, 246, 250, 0.92);
      --dim: rgba(200, 236, 242, 0.62);
      --glass: rgba(4, 30, 40, 0.42);
      --line: rgba(190, 240, 250, 0.22);
      --gold: #ffd36b;
      --font: -apple-system, "SF Pro Display", "Helvetica Neue", "PingFang SC", sans-serif;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #01121a; color: var(--ink);
      font-family: var(--font); -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
    }
    canvas { display: block; touch-action: none; }
    button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
    .hidden { display: none !important; }

    #msg {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #bfe6ee; font-weight: 300; font-size: 15px; line-height: 1.8; text-align: center; padding: 24px;
      pointer-events: none; z-index: 20;
    }

    /* ---------- screens ---------- */
    .screen {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: calc(24px + var(--sat)) calc(24px + var(--sar)) calc(24px + var(--sab)) calc(24px + var(--sal));
      text-align: center; z-index: 10; transition: opacity 0.6s ease;
      text-shadow: 0 2px 14px rgba(0, 20, 30, 0.7);
    }
    .screen.fade { opacity: 0; pointer-events: none; }
    .title { margin: 0; font-weight: 200; font-size: clamp(30px, 8vw, 54px); letter-spacing: 0.32em; padding-left: 0.32em; }
    .tag { margin: 0 0 18px; color: var(--dim); font-size: 14px; letter-spacing: 0.08em; font-weight: 300; }
    .btn {
      min-width: 220px; padding: 15px 28px; border-radius: 999px; border: 1px solid var(--line);
      background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      font-size: 17px; letter-spacing: 0.14em; cursor: pointer; transition: transform 0.12s ease, background 0.2s;
    }
    .btn:active { transform: scale(0.96); background: rgba(20, 70, 85, 0.6); }
    .btn.primary { background: rgba(30, 120, 140, 0.55); border-color: rgba(190, 245, 255, 0.45); font-weight: 500; }
    .btn small { display: block; font-size: 11px; letter-spacing: 0.06em; color: var(--dim); font-weight: 300; margin-top: 2px; }
    .btns { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    /* short landscape phones: tighter layout, buttons side by side */
    @media (max-height: 480px) {
      .screen { gap: 8px; }
      .title { font-size: 32px; }
      .tag { margin-bottom: 8px; font-size: 13px; }
      .btns { flex-direction: row; }
      .btn { min-width: 190px; padding: 12px 22px; }
      .help { margin-top: 4px; }
      .big { font-size: 64px; }
      .stats { margin-bottom: 4px; line-height: 1.6; }
    }
    .best { color: var(--dim); font-size: 13px; letter-spacing: 0.1em; min-height: 1.2em; }
    .help { color: var(--dim); font-size: 12px; line-height: 1.7; max-width: 340px; margin-top: 10px; font-weight: 300; }
    .big { font-size: clamp(54px, 16vw, 96px); font-weight: 200; line-height: 1; letter-spacing: 0.04em; }
    .stats { color: var(--dim); font-size: 14px; line-height: 1.9; margin-bottom: 10px; }
    .stats b { color: var(--ink); font-weight: 500; }
    .newbest { color: var(--gold); letter-spacing: 0.2em; font-size: 13px; }

    /* ---------- in-game HUD ---------- */
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; text-shadow: 0 1px 10px rgba(0, 20, 30, 0.8); }
    #score {
      position: absolute; top: calc(14px + var(--sat)); left: 0; right: 0; text-align: center;
      font-size: 44px; font-weight: 200; letter-spacing: 0.04em; transition: transform 0.08s ease;
    }
    #score.bump { transform: scale(1.12); }
    #combo { position: absolute; top: calc(68px + var(--sat)); left: 0; right: 0; text-align: center; font-size: 15px; letter-spacing: 0.12em; color: var(--dim); opacity: 0; transition: opacity 0.3s; }
    #combo.on { opacity: 1; }
    #combo .mult { color: var(--gold); font-weight: 600; }
    #time {
      position: absolute; top: calc(22px + var(--sat)); left: calc(22px + var(--sal));
      font-size: 22px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: 0.04em;
    }
    #time.low { color: #ff9a8a; }
    #toast {
      position: absolute; top: 34%; left: 0; right: 0; text-align: center; color: var(--gold);
      font-size: 18px; letter-spacing: 0.16em; font-weight: 500; opacity: 0;
    }
    #toast.show { animation: toast 1.4s ease-out; }
    @keyframes toast { 0% { opacity: 0; transform: translateY(10px) scale(0.9); } 15% { opacity: 1; transform: none; } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-24px); } }

    .round {
      position: absolute; pointer-events: auto; border-radius: 50%; border: 1px solid var(--line);
      background: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: none;
    }
    #pause { top: calc(14px + var(--sat)); right: calc(16px + var(--sar)); width: 44px; height: 44px; font-size: 15px; letter-spacing: 0.1em; }
    #dash {
      right: calc(26px + var(--sar)); bottom: calc(30px + var(--sab)); width: 96px; height: 96px;
      font-size: 13px; letter-spacing: 0.18em; font-weight: 600; transition: transform 0.1s;
    }
    #dash.down { transform: scale(0.92); background: rgba(30, 120, 140, 0.6); }
    #dash svg { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); transform: rotate(-90deg); }
    #dash circle { fill: none; stroke-width: 3; }
    #dash .track { stroke: rgba(190, 240, 250, 0.12); }
    #dash .fill { stroke: rgba(170, 245, 255, 0.85); stroke-linecap: round; transition: stroke 0.2s; }
    #dash.locked .fill { stroke: rgba(255, 150, 130, 0.8); }
    #stickHint {
      position: absolute; left: 0; right: 0; bottom: calc(40px + var(--sab)); text-align: center;
      color: var(--dim); font-size: 13px; letter-spacing: 0.1em; transition: opacity 1s;
    }

    #stick {
      position: fixed; left: -64px; top: -64px; width: 128px; height: 128px; border-radius: 50%;
      border: 1px solid rgba(190, 240, 250, 0.25); background: rgba(4, 30, 40, 0.18);
      pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 6;
    }
    #stick.on { opacity: 1; }
    #knob {
      position: absolute; left: 39px; top: 39px; width: 50px; height: 50px; border-radius: 50%;
      background: rgba(200, 245, 255, 0.35); border: 1px solid rgba(220, 250, 255, 0.5);
    }

    #zenBar { position: fixed; top: calc(14px + var(--sat)); right: calc(16px + var(--sar)); z-index: 5; }
    #zenBar .round { position: static; width: 44px; height: 44px; font-size: 18px; }
    #zenHint {
      position: fixed; left: calc(24px + var(--sal)); bottom: calc(22px + var(--sab)); z-index: 5; pointer-events: none;
      color: var(--dim); font-size: 12px; letter-spacing: 0.08em; line-height: 1.7; transition: opacity 2s;
    }
    #mute { position: fixed; bottom: calc(18px + var(--sab)); right: calc(18px + var(--sar)); width: 40px; height: 40px; z-index: 11; font-size: 16px; }
  </style>
</head>
<body>
  <div id="msg">Diving into the deep…</div>

  <!-- title screen -->
  <div id="menu" class="screen fade">
    <h1 class="title">DEEP SCHOOL</h1>
    <p class="tag">One shark. Thousands of sardines. Sixty seconds.</p>
    <div class="btns">
      <button class="btn primary" id="playBtn">HUNT<small>eat as many fish as you can</small></button>
      <button class="btn" id="zenBtn">ZEN<small>just watch &amp; play with the school</small></button>
    </div>
    <div class="best" id="menuBest"></div>
    <div class="help">Drag anywhere to steer · hold <b>DASH</b> to burst<br>Golden fish are worth 10 and add 3 seconds</div>
  </div>

  <!-- pause -->
  <div id="paused" class="screen hidden">
    <div class="title" style="font-size:30px">PAUSED</div>
    <div class="btns">
      <button class="btn primary" id="resumeBtn">RESUME</button>
      <button class="btn" id="quitBtn">QUIT</button>
    </div>
  </div>

  <!-- game over -->
  <div id="over" class="screen hidden">
    <div class="tag" style="margin:0">SCORE</div>
    <div class="big" id="finalScore">0</div>
    <div class="newbest hidden" id="newBest">NEW BEST</div>
    <div class="stats" id="finalStats"></div>
    <div class="btns">
      <button class="btn primary" id="againBtn">HUNT AGAIN</button>
      <button class="btn" id="menuBtn">MENU</button>
    </div>
  </div>

  <!-- hunt HUD -->
  <div id="hud" class="hidden">
    <div id="time">1:00</div>
    <div id="score">0</div>
    <div id="combo"></div>
    <div id="toast"></div>
    <div id="stickHint">drag to steer</div>
    <button class="round" id="pause" aria-label="Pause">II</button>
    <button class="round" id="dash" aria-label="Dash">
      <svg viewBox="0 0 108 108"><circle class="track" cx="54" cy="54" r="51" /><circle class="fill" id="dashFill" cx="54" cy="54" r="51" /></svg>
      DASH
    </button>
  </div>
  <div id="stick"><div id="knob"></div></div>

  <!-- zen mode -->
  <div id="zenBar" class="hidden"><button class="round" id="zenExit" aria-label="Back to menu">✕</button></div>
  <div id="zenHint" class="hidden">Swipe to scatter the school · tap for a shockwave · pinch to zoom</div>

  <button class="round hidden" id="mute" aria-label="Toggle sound">♪</button>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
